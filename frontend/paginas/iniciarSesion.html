<!doctype html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Iniciar sesión | IntechMarket</title>
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
        rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
        crossorigin="anonymous">
    <link rel="stylesheet" href="../css/estilos.css">
</head>
<body class="min-vh-100 d-flex flex-column">
    <header>
        <nav class="navbar navbar-expand-lg navbar-dark navbar-inacap shadow">
            <div class="container">
                <a class="navbar-brand fw-bold" href="../index.html">IntechMarket</a>
                <button
                    class="navbar-toggler"
                    type="button"
                    data-bs-toggle="collapse"
                    data-bs-target="#menuPrincipal"
                    aria-controls="menuPrincipal"
                    aria-expanded="false"
                    aria-label="Mostrar navegación">
                    <span class="navbar-toggler-icon"></span>
                </button>
                <div class="collapse navbar-collapse" id="menuPrincipal">
                    <ul class="navbar-nav ms-auto align-items-lg-center gap-lg-2">
                        <li class="nav-item">
                            <a class="nav-link" href="registrarse.html">Registrarse</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link active" aria-current="page" href="iniciarSesion.html">
                                Iniciar sesión
                            </a>
                        </li>
                    </ul>
                </div>
            </div>
        </nav>
    </header>

    <main class="container flex-grow-1 py-5">
        <div class="row justify-content-center">
            <div class="col-12 col-md-8 col-lg-6 col-xl-5">
                <section class="card shadow-lg">
                    <div class="card-body p-4 p-md-5">
                        <div class="text-center mb-4">
                            <p class="text-uppercase text-danger fw-bold mb-2">Nos alegra verte</p>
                            <h1 class="h2 card-title">Iniciar sesión</h1>
                            <p class="text-muted mb-0">
                                Accede para publicar y administrar tus productos.
                            </p>
                        </div>

                        <form id="formLogin">
                            <div class="mb-3">
                                <label class="form-label" for="correo">Correo institucional</label>
                                <input
                                    class="form-control"
                                    type="email"
                                    id="correo"
                                    autocomplete="email"
                                    required>
                            </div>

                            <div class="mb-4">
                                <label class="form-label" for="password">Contraseña</label>
                                <input
                                    class="form-control"
                                    type="password"
                                    id="password"
                                    autocomplete="current-password"
                                    required>
                            </div>

                            <button class="btn btn-primary btn-lg w-100" type="submit">
                                Iniciar sesión
                            </button>
                        </form>

                        <div id="resultado" class="text-center mt-3" aria-live="polite"></div>

                        <p class="text-center text-muted mt-4 mb-0">
                            ¿Aún no tienes cuenta?
                            <a class="link-danger fw-semibold" href="registrarse.html">Regístrate</a>
                        </p>
                    </div>
                </section>
            </div>
        </div>
    </main>

    <footer class="bg-dark text-white py-4 mt-auto">
        <div class="container">
            <div class="row align-items-center">
                <div class="col-md-7">
                    <h2 class="h5">IntechMarket</h2>
                    <p class="mb-md-0">Marketplace de productos tecnológicos para la comunidad educativa.</p>
                </div>
                <div class="col-md-5 text-md-end">
                    <p class="mb-1">Valdivia, Chile</p>
                    <small>&copy; 2026 IntechMarket</small>
                </div>
            </div>
        </div>
    </footer>

    <script src="../js/login.js"></script>
    <script
        src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>
</body>
</html>
