<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex, nofollow" />
    <title>Redirigiendo | InacapTechMarket</title>
  </head>
  <body>
    <p>
      La recuperación de contraseña ahora está disponible en
      <a id="recovery-link" href="/#/recuperar-password">InacapTechMarket</a>.
    </p>
    <script>
      const token = new URLSearchParams(window.location.search).get('token');
      const destination = token
        ? `/#/recuperar-password?token=${encodeURIComponent(token)}`
        : '/#/recuperar-password';
      document.getElementById('recovery-link').href = destination;
      window.location.replace(destination);
    </script>
  </body>
</html>
