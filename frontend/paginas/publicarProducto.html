<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Publicar Producto</title>
    <link
            href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
            rel="stylesheet"
            integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
            crossorigin="anonymous"
    />
    <link rel="stylesheet" href="../css/estilos.css">
</head>

<body>
    <nav class="navbar navbar-expand-lg navbar-dark navbar-inacap shadow">
        <div class="container">

            <a class="navbar-brand fw-bold" href="productos.html">
                InacaptechMarket
            </a>

            <button
                class="navbar-toggler"
                type="button"
                data-bs-toggle="collapse"
                data-bs-target="#menuNavbar">

                <span class="navbar-toggler-icon"></span>

            </button>

            <div
                class="collapse navbar-collapse"
                id="menuNavbar">

                <ul class="navbar-nav me-auto">

                    <li class="nav-item">
                        <a class="nav-link" href="productos.html">
                            Productos
                        </a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link active" href="publicarProducto.html">
                            Publicar
                        </a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link" href="misPublicaciones.html">
                            Mis publicaciones
                        </a>
                    </li>

                    <li
                        class="nav-item"
                        id="menuAdmin"
                        style="display:none;">
                        <a class="nav-link" href="panelAdmin.html">
                            Panel Admin
                        </a>
                    </li>

                </ul>

                <span
                    id="usuarioActual"
                    class="navbar-text text-white me-3"
                    aria-label="Usuario conectado">
                </span>

                <button
                    id="btnCerrarSesion"
                    class="btn btn-light">
                    Cerrar sesión
                </button>

            </div>

        </div>
    </nav>
        <div class="container mt-5 mb-5">

            <div class="row justify-content-center">

                <div class="col-md-8 col-lg-6">

                    <div class="card shadow">

                        <div class="card-body">

                            <h2 id="tituloFormulario" class="text-center mb-4">
                                Publicar Producto
                            </h2>

                            <form id="formProducto">

                                <div class="mb-3">

                                    <label class="form-label">
                                        Nombre
                                    </label>

                                    <input
                                        type="text"
                                        id="nombre"
                                        class="form-control"
                                        required>

                                </div>

                                <div class="mb-3">

                                    <label class="form-label">
                                        Descripción
                                    </label>

                                    <textarea
                                        id="descripcion"
                                        class="form-control"
                                        rows="4"
                                        required></textarea>

                                </div>

                                <div class="mb-3">

                                    <label class="form-label">
                                        Precio
                                    </label>

                                    <input
                                        type="number"
                                        id="precio"
                                        class="form-control"
                                        required>

                                </div>

                                <div class="mb-3">

                                    <label class="form-label">
                                        Categoría
                                    </label>

                                    <select
                                        id="categoria"
                                        class="form-select"
                                        required>

                                        <option value="">
                                            Seleccione
                                        </option>

                                        <option value="Notebooks">
                                            Notebooks
                                        </option>

                                        <option value="Computadores">
                                            Computadores
                                        </option>

                                        <option value="Monitores">
                                            Monitores
                                        </option>

                                        <option value="Perifericos">
                                            Periféricos
                                        </option>

                                        <option value="Celulares">
                                            Celulares
                                        </option>

                                        <option value="Consolas">
                                            Consolas
                                        </option>

                                        <option value="Componentes">
                                            Componentes
                                        </option>

                                        <option value="Impresoras">
                                            Impresoras
                                        </option>

                                        <option value="Redes">
                                            Redes
                                        </option>

                                        <option value="Otros">
                                            Otros
                                        </option>

                                    </select>

                                </div>

                                <div class="mb-3">

                                    <label class="form-label">
                                        WhatsApp
                                    </label>

                                    <input
                                        type="text"
                                        id="whatsapp"
                                        class="form-control"
                                        placeholder="56912345678"
                                        required>

                                </div>

                                <div class="mb-3">

                                    <label class="form-label">
                                        Comentario
                                    </label>

                                    <textarea
                                        id="comentario"
                                        class="form-control"
                                        rows="3"></textarea>

                                </div>

                                <div class="mb-4">

                                    <label class="form-label">
                                        Imagen
                                    </label>

                                    <input
                                        type="file"
                                        id="imagen"
                                        class="form-control"
                                        accept="image/*"
                                        required>
                                    <small id="ayudaImagen" class="form-text text-muted"></small>

                                </div>

                                <div class="d-grid gap-2">

                                    <button
                                        id="btnGuardarProducto"
                                        type="submit"
                                        class="btn btn-primary btn-lg">

                                        Publicar Producto

                                    </button>

                                    <button
                                        id="btnCancelarEdicion"
                                        type="button"
                                        class="btn btn-outline-secondary btn-lg"
                                        hidden>

                                        Cancelar edición

                                    </button>

                                </div>

                            </form>

                        </div>

                    </div>

                    <div
                        id="resultado"
                        class="mt-3"
                        role="status">
                    </div>

                </div>

            </div>

        </div>

    <hr>

            <footer class="footer-inacap">
            <hr>

            <div class="container">

                <div class="row">

                    <div class="col-md-6">

                        <h5>
                            InacaptechMarket
                        </h5>

                        <p>
                            Plataforma de compra y venta de productos tecnológicos.
                        </p>

                    </div>

                    <div class="col-md-6 text-md-end">

                        <p>
                            © 2026 Todos los derechos reservados
                        </p>

                        <p>
                            Valdivia, Chile
                        </p>

                    </div>

                </div>

            </div>

        </footer>


    <script src="../js/publicarProducto.js"></script>
    <script src="../js/usuarioActual.js"></script>

    <script src="../js/authGuard.js"></script>

    <script>

    const tokenNavbar =
        localStorage.getItem("token");

    if (tokenNavbar) {

        const payload =
            JSON.parse(
                atob(
                    tokenNavbar.split(".")[1]
                )
            );

        if (payload.rol === "admin") {

            document
                .getElementById(
                    "menuAdmin"
                )
                .style.display =
                "block";

        }

    }

    const btnCerrarSesion =
        document.getElementById(
            "btnCerrarSesion"
        );

    if (btnCerrarSesion) {

        btnCerrarSesion.addEventListener(
            "click",
            () => {

                localStorage.removeItem(
                    "token"
                );

                localStorage.removeItem(
                    "usuario"
                );

                window.location.href =
                    "iniciarSesion.html";

            }
        );

    }

    </script>
</body>

</html>
