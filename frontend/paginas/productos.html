    <body>
        <nav class="navbar navbar-expand-lg navbar-dark navbar-inacap shadow">

                <a class="navbar-brand fw-bold" href="productos.html">

                <button

                    type="button"

                    data-bs-target="#menuNavbar">

                    <span class="navbar-toggler-icon"></span>

                </button>

                <div
                    class="collapse navbar-collapse"
                    id="menuNavbar">

                    <ul class="navbar-nav me-auto">

                        <li class="nav-item">
                            <a class="nav-link active" href="productos.html">
                                Productos

                        <li class="nav-item">

                            style="display:none;">

                    </ul>

                    <span
                        id="usuarioActual"
                        class="navbar-text text-white me-3"
                        aria-label="Usuario conectado">
                    </span>

                    <button
                        id="btnCerrarSesion"
                        class="btn btn-light">
                        Cerrar sesión
                    </button>

                </div>

            </div>

        <main>
            <div class="container">

                <h1 class="text-center">Productos Publicados</h1>

                <h3>Filtrar por categoría</h3>

                <select id="filtroCategoria">

                    <option value="Todos">
                        Todos

                    <option value="Notebooks">
                        Notebooks
                    </option>

                    <option value="Computadores">

                    </option>

                    <option value="Monitores">
                        Monitores
                    </option>

                    <option value="Perifericos">
                        Periféricos
                    </option>

                    <option value="Celulares">
                        Celulares
                    </option>

                    <option value="Consolas">
                        Consolas
                    </option>

                    <option value="Componentes">
                        Componentes
                    </option>

                    <option value="Impresoras">
                        Impresoras
                    </option>

                    <option value="Redes">
                        Redes
                    </option>

                    <option value="Otros">
                        Otros
                    </option>

                </select>

                <br><br>

                <div
                    id="contenedorProductos"
                    class="row row-cols-1 row-cols-sm-2 row-cols-lg-3 row-cols-xl-4 g-4">
                </div>
                
                <script src="../js/productos.js"></script>

        <footer class="footer-inacap">
            <hr>

            <div class="container">

                <div class="row">

        </footer>

    
        <script
            src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
            integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
            crossorigin="anonymous"
        ></script>
        <script src="../js/usuarioActual.js"></script>
        <script>

            const token = localStorage.getItem("token");

            if (token) {

                const payload = JSON.parse(
                    atob(token.split(".")[1])
                );

                console.log(payload);

                if (payload.rol === "admin") {

                    const menuAdmin =
                        document.getElementById("menuAdmin");

                    if (menuAdmin) {

                        menuAdmin.style.display = "block";

                    }
                }
            }

            const btnCerrarSesion =
                document.getElementById(
                    "btnCerrarSesion"
                );

            if (btnCerrarSesion) {

                btnCerrarSesion.addEventListener(
                    "click",
                    () => {

                        localStorage.removeItem("token");

                        localStorage.removeItem("usuario");

                        window.location.href =
                            "iniciarSesion.html";

                    }
                );
            }

            </script>


    </body>
</html>
